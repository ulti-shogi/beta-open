<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生まれてから何日目？</title>
  <!-- CSSを読み込む -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- 入力フォームエリア -->
    <div id="form-area">
      <h1>情報を登録する</h1>
      <input type="text" id="nameInput" placeholder="お名前">
      <input type="date" id="dateInput">
      <button onclick="saveData()">登録する</button>
    </div>

    <!-- 結果表示エリア -->
    <div id="result-area">
      <div class="result-name" id="displayName"></div>
      <div>生まれてから今日で</div>
      <div class="result-days" id="displayDays">0<span>日目</span></div>
      <button class="reset-btn" onclick="resetData()">登録情報をリセット</button>
    </div>
  </div>

  <!-- JavaScriptを読み込む -->
  <script src="script.js"></script>
</body>
</html>
